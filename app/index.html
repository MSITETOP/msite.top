<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocks Installer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 30px;
    }

    h1 {
      margin-bottom: 30px;
      color: #CA2F5D;
      font-size: 28px;
    }

    .blocks-list {
      list-style: none;
    }

    .block-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      margin-bottom: 10px;
      background: #f8f8f8;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
      transition: all 0.2s;
    }

    .block-item:hover {
      background: #f0f0f0;
      border-color: #CA2F5D;
    }

    .block-code {
      font-family: 'Courier New', monospace;
      font-size: 16px;
      font-weight: 500;
      color: #333;
      flex: 1;
    }

    .block-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-add {
      background: #CA2F5D;
      color: white;
    }

    .btn-add:hover {
      background: #b0284d;
    }

    .btn-remove {
      background: #dc3545;
      color: white;
    }

    .btn-remove:hover {
      background: #c82333;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      border: 1px solid #fcc;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .success {
      background: #d4edda;
      color: #155724;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      border: 1px solid #c3e6cb;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Blocks Installer</h1>
    <div id="error-container"></div>
    <div id="loading" class="loading">Loading blocks...</div>
    <ul id="blocks-list" class="blocks-list" style="display: none;"></ul>
  </div>

  <script>
    let blocks = [];

    // Загрузка списка блоков из blocks.json
    async function loadBlocks() {
      try {
        const response = await fetch('blocks.json');
        if (!response.ok) {
          throw new Error(`Failed to load blocks.json: ${response.status}`);
        }
        blocks = await response.json();
        renderBlocks();
      } catch (error) {
        showError(`Error loading blocks: ${error.message}`);
        document.getElementById('loading').style.display = 'none';
      }
    }

    // Отображение ошибки
    function showError(message) {
      const errorContainer = document.getElementById('error-container');
      errorContainer.innerHTML = `<div class="error">${message}</div>`;
    }

    // Отображение успешного сообщения
    function showSuccess(message) {
      const errorContainer = document.getElementById('error-container');
      errorContainer.innerHTML = `<div class="success">${message}</div>`;
      // Автоматически скрываем сообщение через 5 секунд
      setTimeout(() => {
        errorContainer.innerHTML = '';
      }, 5000);
    }

    // Рендеринг списка блоков
    function renderBlocks() {
      const loadingEl = document.getElementById('loading');
      const listEl = document.getElementById('blocks-list');

      loadingEl.style.display = 'none';
      listEl.style.display = 'block';
      listEl.innerHTML = '';

      if (blocks.length === 0) {
        listEl.innerHTML = '<div class="empty-state">No blocks found</div>';
        return;
      }

      blocks.forEach((blockCode, index) => {
        const li = document.createElement('li');
        li.className = 'block-item';
        
        const addButton = document.createElement('button');
        addButton.className = 'btn btn-add';
        addButton.textContent = 'Add';
        addButton.onclick = () => addBlock(blockCode, addButton);
        
        const removeButton = document.createElement('button');
        removeButton.className = 'btn btn-remove';
        removeButton.textContent = 'Remove';
        removeButton.onclick = () => removeBlock(blockCode, removeButton);
        
        const blockCodeSpan = document.createElement('span');
        blockCodeSpan.className = 'block-code';
        blockCodeSpan.textContent = blockCode;
        
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'block-actions';
        actionsDiv.appendChild(addButton);
        actionsDiv.appendChild(removeButton);
        
        li.appendChild(blockCodeSpan);
        li.appendChild(actionsDiv);
        listEl.appendChild(li);
      });
    }

    // Добавление блока
    async function addBlock(blockCode, button) {
      if (!window.BX24) {
        showError('Bitrix24 API is not available. Please run this page in Bitrix24 context.');
        return;
      }

      try {
        // Показываем индикатор загрузки
        const originalText = button.textContent;
        button.disabled = true;
        button.textContent = 'Loading...';

        // Загружаем файлы блока
        const [infoResponse, manifestResponse, contentResponse] = await Promise.all([
          fetch(`blocks/${blockCode}/info.json`),
          fetch(`blocks/${blockCode}/manifest.json`),
          fetch(`blocks/${blockCode}/block.html`)
        ]);

        if (!infoResponse.ok || !manifestResponse.ok || !contentResponse.ok) {
          throw new Error(`Failed to load block files for ${blockCode}`);
        }

        const info = await infoResponse.json();
        const manifest = await manifestResponse.json();
        const content = await contentResponse.text();

        // Формируем данные для регистрации блока
        // Объединяем данные из info.json с манифестом
        const blockData = {
          code: info.code,
          manifest: {
            ...manifest,
            // Добавляем поля из info.json в манифест, если они нужны
            block: {
              ...manifest.block,
              name: info.fields?.NAME || manifest.block?.name || info.code,
              description: info.fields?.DESCRIPTION || manifest.block?.description || ''
            }
          },
          content: content
        };

        // Регистрируем блок через Bitrix24 API
        BX24.callMethod(
          'landing.repo.register',
          blockData,
          function(result) {
            button.disabled = false;
            button.textContent = originalText;

            if (result.error()) {
              showError(`Error registering block "${blockCode}": ${result.error()}`);
              console.error('Registration error:', result.error());
            } else {
              console.info('Block registered successfully:', result.data());
              showSuccess(`Block "${blockCode}" has been successfully registered in Bitrix24!`);
            }
          }
        );
      } catch (error) {
        showError(`Error adding block "${blockCode}": ${error.message}`);
        console.error('Add block error:', error);
        button.disabled = false;
        button.textContent = 'Add';
      }
    }

    // Удаление блока
    function removeBlock(blockCode, button) {
      if (!window.BX24) {
        showError('Bitrix24 API is not available. Please run this page in Bitrix24 context.');
        return;
      }

      if (!confirm(`Remove block "${blockCode}" from Bitrix24 repository?`)) {
        return;
      }

      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = 'Removing...';

      BX24.callMethod(
        'landing.repo.unregister',
        { code: blockCode },
        function(result) {
          button.disabled = false;
          button.textContent = originalText;

          if (result.error()) {
            showError(`Error removing block "${blockCode}": ${result.error()}`);
            console.error('Removal error:', result.error());
          } else {
            console.info('Block removed successfully:', result.data());
            showSuccess(`Block "${blockCode}" has been successfully removed from Bitrix24 repository!`);
          }
        }
      );
    }

    // Проверка доступности Bitrix24 API
    function checkBitrix24API() {
      if (!window.BX24) {
        showError('Bitrix24 API (BX24) is not available. This page must be run in Bitrix24 context.');
        return false;
      }
      return true;
    }

    // Инициализация при загрузке страницы
    document.addEventListener('DOMContentLoaded', function() {
      if (checkBitrix24API()) {
        loadBlocks();
      } else {
        document.getElementById('loading').style.display = 'none';
      }
    });
  </script>
</body>

</html>

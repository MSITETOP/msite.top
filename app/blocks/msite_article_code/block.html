<div class="article-block">
  <div class="container">
    <div class="article-code" data-code-language="javascript">
      <div class="article-code__topbar" aria-hidden="true">
        <div class="article-code__language">
          <span class="article-code__language-label article-code__language-label--javascript">javascript</span>
          <span class="article-code__language-label article-code__language-label--python">python</span>
        </div>
        <div class="article-code__actions">
          <button type="button" class="article-code__action article-code__action--copy" aria-label="Copy code" data-action="copy">
            <svg class="article-code__icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 9h10v10H9z" />
              <path d="M5 5h10v10" />
            </svg>
          </button>
        </div>
      </div>
      <pre class="article-code__pre"><code class="article-code__code landing-block-node-article-code" data-line-numbers="1">console.log("Hello from JavaScript");</code></pre>
      <script>
        (function () {
          var articleCode = document.currentScript && document.currentScript.closest('.article-code');
          if (!articleCode) return;

          var codeEl = articleCode.querySelector('.article-code__code');
          if (!codeEl || codeEl.dataset.lineNumbersApplied === '1') return;

          // Note: we rely on the server/CMS to inject code as plain text into this <code>.
          // Then we split it into lines for CSS-based gutter rendering.
          var raw = (codeEl.textContent || '');
          if (raw.endsWith('\n')) raw = raw.slice(0, -1);
          codeEl.dataset.rawCode = raw;
          var lines = raw.length ? raw.split('\n') : [''];

          codeEl.textContent = '';
          for (var i = 0; i < lines.length; i++) {
            var lineEl = document.createElement('span');
            lineEl.className = 'article-code__line';

            var numEl = document.createElement('span');
            numEl.className = 'article-code__line-num';
            numEl.setAttribute('aria-hidden', 'true');
            numEl.textContent = String(i + 1);

            var textEl = document.createElement('span');
            textEl.className = 'article-code__line-text';
            textEl.textContent = lines[i];

            lineEl.appendChild(numEl);
            lineEl.appendChild(textEl);
            codeEl.appendChild(lineEl);
          }

          codeEl.dataset.lineNumbersApplied = '1';

          var copyBtn = articleCode.querySelector('.article-code__action[data-action="copy"]');
          if (!copyBtn || copyBtn.dataset.copyBound === '1') return;
          copyBtn.dataset.copyBound = '1';

          var copiedTimer = null;

          function setCopiedState(enabled) {
            copyBtn.dataset.copied = enabled ? '1' : '';
            if (enabled) {
              copyBtn.setAttribute('aria-label', 'Copied');
              if (copiedTimer) window.clearTimeout(copiedTimer);
              copiedTimer = window.setTimeout(function () {
                copyBtn.removeAttribute('aria-label');
                copyBtn.removeAttribute('data-copied');
              }, 1400);
            }
          }

          function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              return navigator.clipboard.writeText(text);
            }

            // Fallback: legacy clipboard via temporary textarea
            return new Promise(function (resolve) {
              try {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', 'true');
                ta.style.position = 'fixed';
                ta.style.top = '-1000px';
                ta.style.left = '-1000px';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                resolve();
              } catch (e) {
                resolve();
              }
            });
          }

          copyBtn.addEventListener('click', function () {
            var text = codeEl.dataset.rawCode || '';
            copyToClipboard(text).then(function () {
              setCopiedState(true);
            });
          });
        })();
      </script>
    </div>
  </div>
</div>
